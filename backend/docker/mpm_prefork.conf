# Free-tier profile: Render Free (512 MB / 0.1 CPU) + Aiven Free (76 max
# connections). Keep worker count low so the container stays within memory
# and leaves connection headroom for sessions/cache/health checks.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          6
    MaxRequestWorkers        15
    ServerLimit              16
    MaxConnectionsPerChild   500
</IfModule>
